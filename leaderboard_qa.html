<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaderboard QA</title>
    <style>
        :root {
            --group-ink:#061634; --group-muted:#68758A; --group-line:#DCE5EF;
            --group-green:#00A86B; --group-green-strong:#008F5B; --group-red:#C62828;
            --marker-pushup:#015936; --marker-situp:#2563EB; --marker-run:#F97316;
        }
        * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; letter-spacing:0; }
        body { background:#E2E8F0; padding:40px; color:var(--group-ink); }
        .group-switcher-shell { display:grid; gap:10px; margin-bottom:14px; }
        .group-switcher-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .group-switcher { display:flex; align-items:center; overflow-x:auto; background:#fff; border:1px solid var(--group-line); border-radius:8px; }
        .filter-pill { border:1px solid transparent; background:transparent; color:var(--group-ink); cursor:pointer; white-space:nowrap; font-weight:750; }
        .group-tab, .create-group-pill { display:inline-flex; align-items:center; border-radius:8px; }
        .group-tab.active { color:#006D48; background:#E8F8F2; border-color:#BCEBD9; }
        .create-group-pill { border-color:var(--group-line); background:#fff; }
        .leaderboard-list { display:grid; gap:10px; }
        .leader-card { background:#fff; border:1px solid var(--group-line); border-bottom:3px solid var(--group-green); border-radius:8px; box-shadow:0 8px 18px rgba(15,23,42,.06); }
        .leader-name strong { color:var(--group-ink); font-weight:700; }
        .award-pill { display:inline-flex; align-items:center; gap:8px; width:fit-content; border:1px solid #C9EADA; border-radius:999px; background:#EBF8F2; color:var(--group-green-strong); font-size:10px!important; font-weight:650; text-transform:uppercase; }
        .leader-score { display:none; }
        .leader-metric { border:1px solid #DBE8EA; border-radius:8px; background:#F7FCFA; }
        .leader-metric.metric-situp { border-color:#DDE7FB; background:#F7FAFF; }
        .leader-metric.metric-run { border-color:#F8DFC7; background:#FFF9F3; }
        .metric-pushup span { color:var(--marker-pushup); }
        .metric-situp span { color:var(--marker-situp); }
        .metric-run span { color:var(--marker-run); }
        .leader-metric span,.leader-metric small { color:var(--group-muted); font-weight:650; text-transform:uppercase; }
        .leader-metric strong { color:var(--group-ink); font-weight:700; }
        @media (min-width:761px) {
            .group-switcher-shell { grid-template-columns:minmax(0,max-content) auto; align-items:stretch; justify-content:start; }
            .group-switcher { width:fit-content; max-width:min(100%,760px); gap:6px; padding:8px; margin-bottom:0; }
            .group-switcher-actions { align-items:stretch; flex-wrap:nowrap; }
            .group-tab,.create-group-pill,.qr-switcher-button { min-height:42px; gap:7px; padding:7px 12px; font-size:15px!important; }
            .group-tab-icon,.create-group-icon { width:22px; height:22px; flex:0 0 22px; }
            .leader-card,.leader-card.no-trophy { display:grid; grid-template-columns:minmax(160px,.72fr) minmax(0,3fr) auto; align-items:stretch; gap:12px; min-height:0; padding:14px 16px; }
            .leader-card:not(.no-trophy) { grid-template-columns:46px minmax(160px,.72fr) minmax(0,3fr) auto; }
            .leader-rank-block { display:flex; align-items:center; justify-content:center; align-self:stretch; }
            .trophy-icon { width:42px; height:42px; object-fit:contain; }
            .leader-main { align-self:center; display:grid; align-content:center; min-height:52px; }
            .leader-name strong { font-size:20px!important; line-height:1.15; }
            .award-pill { min-height:24px; margin-top:6px; padding:0 9px 0 5px; }
            .award-pill img { width:22px; height:22px; object-fit:contain; }
            .leader-metrics { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; align-self:stretch; }
            .leader-metric { min-height:54px; display:flex; align-items:center; justify-content:flex-start; gap:7px; padding:8px 10px; }
            .metric-icon { width:22px; height:22px; flex:0 0 22px; margin:0; object-fit:contain; }
            .leader-metric span,.leader-metric small { display:inline; font-size:11px!important; line-height:1; flex:0 0 auto; }
            .leader-metric strong { display:inline; font-size:20px!important; line-height:1; margin-top:0; white-space:nowrap; flex:0 0 auto; }
            .leader-metric.metric-run strong { font-size:19px!important; }
            .leader-metric.metric-score { border-color:#C9EADA; background:#F7FCFA; }
            .leader-metric.metric-score span,.leader-metric.metric-score strong { color:var(--group-green); }
            .leader-metric.metric-award small { display:none; }
            .leader-metric.metric-award.award-gold strong { color:#A36300; }
            .leader-metric.metric-award.award-silver strong { color:#526173; }
            .leader-metric.metric-award.award-pass strong,.leader-metric.metric-award.award-pass-incentive strong { color:var(--group-green-strong); }
        }
    </style>
</head>
<body>
    <div class="group-switcher-shell">
        <div class="group-switcher"><button class="filter-pill group-tab active"><img class="group-tab-icon" src="/static/icons/group.png" alt="">Gorgi family</button></div>
        <div class="group-switcher-actions">
            <button class="filter-pill create-group-pill"><img class="create-group-icon" src="/static/icons/creategroup.png" alt="">New Group</button>
            <button class="filter-pill create-group-pill qr-switcher-button"><img class="create-group-icon" src="/static/icons/qrcode.png" alt="">Invite QR</button>
        </div>
    </div>
    <section class="leaderboard-list">
        <article class="leader-card">
            <div class="leader-rank-block"><img class="trophy-icon" src="/static/icons/1stplace.png" alt=""></div>
            <div class="leader-main"><div class="leader-name"><strong>Branden</strong></div><span class="award-pill pass"><img src="/static/icons/passbadge.png" alt="">Pass</span></div>
            <div class="leader-score"><strong>30</strong><span>PTS</span></div>
            <div class="leader-metrics">
                <div class="leader-metric metric-pushup"><img class="metric-icon" src="/static/icons/greenpushup.png" alt=""><span>PUSH-UP</span><strong>100</strong><small>reps</small></div>
                <div class="leader-metric metric-situp"><img class="metric-icon" src="/static/icons/bluesitup.png" alt=""><span>SIT-UP</span><strong>80</strong><small>reps</small></div>
                <div class="leader-metric metric-run"><img class="metric-icon" src="/static/icons/orangerun.png" alt=""><span>RUN</span><strong>12:34</strong><small>min</small></div>
                <div class="leader-metric metric-score"><img class="metric-icon" src="/static/icons/star.png" alt=""><span>POINTS</span><strong>30</strong><small>pts</small></div>
                <div class="leader-metric metric-award award-pass"><img class="metric-icon" src="/static/icons/passbadge.png" alt=""><span>IPPT</span><strong>Pass</strong><small>status</small></div>
            </div>
        </article>
    </section>
</body>
</html>
