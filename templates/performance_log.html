{% extends 'base.html' %}
{% block title %}Performance Log | FitLah NSmen Portal{% endblock %}
{% block content %}
<style>
  .performance-page {
    color: #0F172A;
    width: 100%;
  }

  .performance-page .header-section { margin-bottom: 0; }
  .performance-page .header-section h1 { font-size: 24px; color: #0F172A; }
  .performance-page .header-section p { font-size: 14px; color: #000000; margin-top: 4px; }

  .log-workspace-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 32px;
    width: 100%;
  }

  .calendar-card {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 24px;
    height: fit-content;
    position: sticky;
    top: 32px;
  }

  .calendar-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .calendar-month-title { font-size: 16px; font-weight: 700; color: #0F172A; }

  .nav-btn {
    background: none;
    border: 1px solid #E2E8F0;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    font-size: 14px;
    color: #000000;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: #F8FAFC; }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    text-align: center;
  }

  .weekday-label {
    font-size: 11px;
    font-weight: 700;
    color: #64748B;
    text-transform: uppercase;
    padding-bottom: 4px;
  }

  .calendar-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid #E2E8F0;
    border-radius: 8px;
    background: #F8FAFC;
    font-size: 12px;
    font-weight: 600;
    color: #0F172A;
    cursor: pointer;
    transition: all 0.15s;
    gap: 2px;
  }
  .calendar-day:hover { border-color: #015936; background: #E8F8F2; }
  .calendar-day.today { border-color: #015936; color: #015936; }
  .calendar-day.active-selected { background: #015936; color: #FFF; border-color: #015936; }
  .calendar-day.empty { background: transparent; border: none; cursor: default; }
  .calendar-day.empty:hover { background: transparent; border: none; }

  .day-dots { display: flex; gap: 3px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; }
  .dot.pushup { background: #015936; }
  .dot.situp { background: #2563EB; }
  .dot.run { background: #F97316; }
  .calendar-day.active-selected .dot { background: rgba(255,255,255,0.9); }

  .details-display-stack { display: flex; flex-direction: column; gap: 20px; }

  .agenda-card {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 24px;
  }

  .agenda-item { display: flex; gap: 16px; }

  .agenda-color-bar { width: 4px; border-radius: 2px; flex-shrink: 0; }
  .agenda-color-bar.pushup { background: #015936; }
  .agenda-color-bar.situp { background: #2563EB; }
  .agenda-color-bar.run { background: #F97316; }

  .agenda-details { display: flex; flex-direction: column; width: 100%; }
  .agenda-date { font-size: 11px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }
  .agenda-name { font-size: 18px; font-weight: 700; color: #0F172A; margin-top: 2px; }

  .recording-metric-container {
    display: flex;
    align-items: center;
    gap: 32px;
    padding-top: 16px;
    margin-top: 12px;
    border-top: 1px solid #E2E8F0;
    flex-wrap: wrap;
  }

  .metric-block-large { display: flex; flex-direction: column; gap: 4px; }
  .metric-label-small { font-size: 11px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }
  .metric-value-huge { font-size: 32px; font-weight: 800; color: #0F172A; line-height: 1.1; }
  .metric-value-huge span { font-size: 14px; font-weight: 600; color: #64748B; }
  .metric-divider-line { width: 1px; height: 44px; background: #E2E8F0; }

  .no-entry {
    text-align: center;
    padding: 40px 20px;
    color: #94A3B8;
    font-size: 14px;
  }
  .no-entry .icon { font-size: 32px; margin-bottom: 8px; }

  /* Modal and Button styles removed */

  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 28px; }

  .legend {
    display: flex;
    gap: 14px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #64748B; font-weight: 600; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  .delete-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: #94A3B8;
    cursor: pointer;
    font-size: 18px;
    padding: 2px 6px;
    border-radius: 6px;
    transition: all 0.15s;
    line-height: 1;
  }
  .delete-btn:hover { background: #FEE2E2; color: #E11D48; }

  .selected-date-header {
    font-size: 14px;
    font-weight: 600;
    color: #64748B;
    margin-bottom: 4px;
  }

  .ai-coach-block {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #E2E8F0;
    width: 100%;
  }

  .ai-coach-block h5 {
    font-size: 14px;
    font-weight: 800;
    color: #2776EA;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ai-coach-summary {
    font-size: 13.5px;
    color: #334155;
    line-height: 1.55;
    margin-bottom: 12px;
    padding: 12px 14px;
    background: #F8FAFC;
    border-radius: 8px;
    border-left: 3px solid #2776EA;
  }

  .ai-coach-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 700px) {
    .ai-coach-grid { grid-template-columns: 1fr; }
  }

  .ai-coach-list h6 {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }

  .ai-coach-list.dos h6 { color: #015936; }
  .ai-coach-list.donts h6 { color: #BE123C; }

  .ai-coach-list ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    color: #475569;
    line-height: 1.45;
  }

  .ai-coach-list li { margin-bottom: 4px; }

  .ai-coach-focus {
    margin-top: 10px;
    font-size: 12px;
    color: #64748B;
    font-style: italic;
  }

  @media (max-width: 700px) {
    .log-workspace-grid { grid-template-columns: 1fr; }
    .calendar-card { position: static; }
  }
</style>

<div class="performance-page">
<div class="header-row">
  <div class="header-section">
    <h1>Performance Log</h1>
    <p>Track your fitness entries and progress notes.</p>
  </div>
</div>

<div class="log-workspace-grid">
  <!-- Calendar -->
  <div class="calendar-card">
    <div class="calendar-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
      <div class="calendar-month-title" id="monthTitle"></div>
      <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#015936"></div>Push-up</div>
      <div class="legend-item"><div class="legend-dot" style="background:#2563EB"></div>Sit-up</div>
      <div class="legend-item"><div class="legend-dot" style="background:#F97316"></div>2.4km Run</div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="details-display-stack" id="detailsPanel"></div>
</div>

<!-- Modal markup removed -->

<script src="{{ url_for('static', filename='js/pages/performance_log.js') }}"></script>
</div>
{% endblock %}
