<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FitLah NSmen Portal{% endblock %}</title>
    <style>
        :root {
            --primary: #00A86B;
            --primary-hover: #008F5B;
            --bg-body: #E2E8F0;
            --bg-main: #FAFAFA;
            --bg-card: #FFFFFF;
            --bg-sidebar: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --accent-blue: #2563EB;
            --accent-blue-light: #EFF6FF;
            --accent-slate: #475569;
            --accent-rose: #E11D48;
            --accent-rose-light: #FFE4E6;
            --bg-badge: #E8F8F2;
            --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
            --radius: 12px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body {
            background-color: var(--bg-body);
            display: flex;
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            width: 100%;
        }
        /* Sidebar Component */
        .sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 36px 24px;
            flex-shrink: 0;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 48px;
        }
        .logo span { color: var(--primary); }
        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            border-radius: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .nav-item:hover {
            color: var(--text-main);
            background-color: #F8FAFC;
        }
        .nav-item.active {
            color: var(--primary);
            background-color: var(--bg-badge);
            font-weight: 600;
        }
        .nav-item svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .logout-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
        }
        .logout-link:hover {
            color: var(--accent-rose);
        }
        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding-top: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background-color: #F1F5F9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 11px;
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .user-info .name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }
        .user-info .role {
            font-size: 11px;
            color: var(--text-muted);
        }
        /* Main Workspace Content */
        .main-workspace {
            flex: 1;
            display: flex;
            margin-left: 240px;
            overflow: hidden;
        }
        .main-content {
            flex: 1;
            padding: 44px 40px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .header-section {
            margin-bottom: 36px;
        }
        .header-section h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }
        .header-section p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">Fit<span>Lah</span></div>
            <nav class="nav-group">
                <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.path == '/' %}active{% endif %}">
                    <svg viewBox="0 0 24 24"><polyline points="12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5 12 3"></polyline></svg>
                    Dashboard
                </a>
                <a href="{{ url_for('group') }}" class="nav-item {% if request.path == '/group' %}active{% endif %}">
                    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Group
                </a>
                <a href="{{ url_for('performance') }}" class="nav-item {% if request.path == '/performance' %}active{% endif %}">
                    <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 17"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                    Performance
                </a>
                <a href="{{ url_for('dashboard_graph') }}" class="nav-item {% if request.path == '/dashboard-graph' %}active{% endif %}">
                    <svg viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M4 19h16"></path><path d="M8 15l3-4 3 2 4-7"></path></svg>
                    Graphs
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="avatar-placeholder">{{ (current_user.name if current_user else 'FL')[:2].upper() }}</div>
                <div class="user-info">
                    <div class="name">{{ current_user.name if current_user else 'FitLah User' }}</div>
                    <div class="role">{{ current_user.rank if current_user else 'Soldier' }}</div>
                    {% if current_user %}
                    <a class="logout-link" href="{{ url_for('logout') }}">Logout</a>
                    {% endif %}
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <div class="main-workspace">
            <div class="main-content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
