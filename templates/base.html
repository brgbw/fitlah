<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FitLah NSmen Portal{% endblock %}</title>
    <style>
        :root {
            --primary: #00A86B;
            --primary-hover: #008F5B;
            --bg-body: #E2E8F0;
            --bg-sidebar: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --bg-badge: #E8F8F2;
            --bg-surface: #FFFFFF;
            --bg-subtle: #F8FAFC;
            --card-radius: 12px;
            --card-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
            --font-scale: {{ font_scale|default(1.0) }};
            --page-title-size: calc(40px * var(--font-scale));
            --page-title-weight: 650;
            --page-subtitle-size: calc(20px * var(--font-scale));
            --page-max-width: none;
            --marker-pushup: #015936;
            --marker-situp: #2563EB;
            --marker-run: #F97316;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            min-height: 100vh;
            font-size: calc(18px * var(--font-scale));
        }

        .app-container {
            display: flex;
            width: 100%;
        }

        .sidebar-rail {
            width: 16px;
            min-height: 100vh;
            flex: 0 0 16px;
            transition: width 0.2s ease, flex-basis 0.2s ease;
            position: relative;
            z-index: 50;
        }

        .sidebar-rail:hover,
        .sidebar-rail:focus-within {
            width: 240px;
            flex-basis: 240px;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 36px 24px;
            height: 100vh;
            position: sticky;
            left: 0;
            top: 0;
            overflow-y: auto;
            z-index: 50;
            transition: transform 0.2s ease;
            transform: translateX(calc(-100% + 16px));

            /* subtle depth */
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.03);
        }

        .sidebar::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 16px;
            height: 100vh;
            background: transparent;
        }

        .sidebar:hover,
        .sidebar:focus-within {
            transform: translateX(0);
        }

        .logo {
            font-size: 36px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 48px;
        }

        .logo span { color: var(--primary); }

        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: calc(18px * var(--font-scale));
            border-radius: 8px;

            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background-color: #F8FAFC;
            color: var(--text-main);
            transform: translateX(2px);
        }

        .nav-item.active {
            color: var(--primary);
            background-color: var(--bg-badge);
            font-weight: 600;

            border-left: 3px solid var(--primary);
            padding-left: 11px;
        }

        /* Footer */
        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding-top: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: inherit;
            text-decoration: none;
            border-radius: 10px;
            transition: background-color 0.15s ease, padding 0.15s ease;
        }

        .sidebar-footer:hover {
            background-color: #F8FAFC;
            padding-left: 8px;
            padding-right: 8px;
        }

        /* Soldier image */
        .soldier-img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid var(--border);

            /* subtle polish */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* User info */
        .user-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-info .name {
            font-size: calc(18px * var(--font-scale));
            font-weight: 700;
            color: var(--text-main);
        }

        .user-info .role {
            font-size: calc(16px * var(--font-scale));
            color: var(--text-muted);
        }

        .logout-link {
            font-size: calc(16px * var(--font-scale));
            color: var(--text-muted);
            text-decoration: none;
        }

        .logout-link:hover {
            color: #E11D48;
        }

        /* Main */
        .main-workspace {
            flex: 1;
            min-width: 0;
            display: flex;
        }

        .main-content {
            flex: 1;
            padding: 44px 40px;
            overflow-y: auto;
            width: 100%;
            min-height: 100vh;
        }

        .header-section h1 {
            font-size: var(--page-title-size);
            font-weight: var(--page-title-weight);
            letter-spacing: -0.4px;
            color: var(--text-main);
        }

        .header-section p {
            font-size: var(--page-subtitle-size);
            color: var(--text-muted);
            line-height: 1.6;
        }

        @media (max-width: 760px) {
            .sidebar-rail,
            .sidebar-rail:hover,
            .sidebar-rail:focus-within {
                width: 16px;
                flex-basis: 16px;
            }

            .sidebar {
                width: min(280px, 86vw);
            }

            .main-workspace {
                margin-left: 0;
            }

            .main-content {
                padding: 74px 18px 28px;
            }
        }
    </style>
    <script src="{{ asset_url('js/pages/ai_text_format.js') }}"></script>
    {% block extra_head %}{% endblock %}
</head>

<body>
<div class="app-container">

    <!-- Sidebar -->
    <div class="sidebar-rail">
    <aside class="sidebar">

        <div class="logo">Fit<span>Lah</span></div>

        <nav class="nav-group">
            <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.path in ['/', '/dashboard'] %}active{% endif %}">
                Dashboard
            </a>

            <a href="{{ url_for('group') }}" class="nav-item {% if request.path == '/group' %}active{% endif %}">
                Group
            </a>

            <a href="{{ url_for('calendar') }}" class="nav-item {% if request.path in ['/calendar', '/performance'] %}active{% endif %}">
                Calendar
            </a>

            <a href="{{ url_for('analytics') }}" class="nav-item {% if request.path == '/analytics' %}active{% endif %}">
                Analytics
            </a>
        </nav>

        <!-- Footer -->
        <a class="sidebar-footer" href="{{ url_for('settings') }}" aria-label="Open settings">

            <img class="soldier-img"
                 src="{{ url_for('static', filename='icons/soldier.jpg') }}"
                 alt="Soldier">

            <div class="user-info">
                <div class="name">
                    {{ current_user.name if current_user else 'FitLah User' }}
                </div>

                <div class="role">
                    {{ current_user.rank if current_user else 'Soldier' }}
                </div>

                {% if current_user %}
                <span class="logout-link" onclick="event.preventDefault(); event.stopPropagation(); window.location.href='{{ url_for('logout') }}';">Logout</span>
                {% endif %}
            </div>

        </a>

    </aside>
    </div>

    <!-- Main -->
    <div class="main-workspace">
        <div class="main-content">
            {% block content %}{% endblock %}
            <style>
                .main-content :where(h1) {
                    font-size: calc(40px * var(--font-scale)) !important;
                }

                .main-content :where(h2) {
                    font-size: calc(34px * var(--font-scale)) !important;
                }

                .main-content :where(h3) {
                    font-size: calc(26px * var(--font-scale)) !important;
                }

                .main-content :where(h4, h5, h6) {
                    font-size: calc(22px * var(--font-scale)) !important;
                }

                .main-content :where(p, li, td, th, label, input, select, textarea, button, a, small) {
                    font-size: max(calc(18px * var(--font-scale)), 1em) !important;
                    line-height: 1.5;
                }

                .main-content :where(span) {
                    font-size: max(calc(16px * var(--font-scale)), 1em) !important;
                    line-height: 1.35;
                }

                .main-content :where(.panel-title, .panel-kicker, .action-meta, .award-pill, .strava-btn, .primary-btn, .calendar-day, .weekday-label, .agenda-date, .metric-label-small, .legend-item, .status-badge-pill) {
                    font-size: calc(18px * var(--font-scale)) !important;
                }
            </style>
        </div>
    </div>

</div>

<!-- Vercel Speed Insights -->
<script type="module">
  import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@1/dist/index.mjs';
  injectSpeedInsights();
</script>

</body>
</html>
