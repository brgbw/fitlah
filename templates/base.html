<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FitLah NSmen Portal{% endblock %}</title>

    <style>
        :root {
            --primary: #00A86B;
            --primary-hover: #008F5B;
            --bg-body: #E2E8F0;
            --bg-sidebar: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --bg-badge: #E8F8F2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            width: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 36px 24px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;

            /* subtle depth */
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.03);
        }

        .logo {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 48px;
        }

        .logo span { color: var(--primary); }

        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            border-radius: 8px;

            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background-color: #F8FAFC;
            color: var(--text-main);
            transform: translateX(2px);
        }

        .nav-item.active {
            color: var(--primary);
            background-color: var(--bg-badge);
            font-weight: 600;

            border-left: 3px solid var(--primary);
            padding-left: 11px;
        }

        /* Footer */
        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding-top: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: inherit;
            text-decoration: none;
            border-radius: 10px;
            transition: background-color 0.15s ease, padding 0.15s ease;
        }

        .sidebar-footer:hover {
            background-color: #F8FAFC;
            padding-left: 8px;
            padding-right: 8px;
        }

        /* Soldier image */
        .soldier-img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid var(--border);

            /* subtle polish */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* User info */
        .user-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-info .name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .user-info .role {
            font-size: 12px;
            color: var(--text-muted);
        }

        .logout-link {
            font-size: 11px;
            color: var(--text-muted);
            text-decoration: none;
        }

        .logout-link:hover {
            color: #E11D48;
        }

        /* Main */
        .main-workspace {
            flex: 1;
            margin-left: 240px;
            display: flex;
        }

        .main-content {
            flex: 1;
            padding: 44px 40px;
            overflow-y: auto;
        }

        .header-section h1 {
            font-size: 26px;
            font-weight: 700;
        }

        .header-section p {
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
<div class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">Fit<span>Lah</span></div>

        <nav class="nav-group">
            <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.path == '/' %}active{% endif %}">
                Dashboard
            </a>

            <a href="{{ url_for('group') }}" class="nav-item {% if request.path == '/group' %}active{% endif %}">
                Group
            </a>

            <a href="{{ url_for('calendar') }}" class="nav-item {% if request.path in ['/calendar', '/performance'] %}active{% endif %}">
                Calendar
            </a>

            <a href="{{ url_for('dashboard_graph') }}" class="nav-item {% if request.path == '/dashboard-graph' %}active{% endif %}">
                Graphs
            </a>
        </nav>

        <!-- Footer -->
        <a class="sidebar-footer" href="{{ url_for('settings') }}" aria-label="Open settings">

            <img class="soldier-img"
                 src="{{ url_for('static', filename='icon/soldier.jpg') }}"
                 alt="Soldier">

            <div class="user-info">
                <div class="name">
                    {{ current_user.name if current_user else 'FitLah User' }}
                </div>

                <div class="role">
                    {{ current_user.rank if current_user else 'Soldier' }}
                </div>

                {% if current_user %}
                <span class="logout-link" onclick="event.preventDefault(); event.stopPropagation(); window.location.href='{{ url_for('logout') }}';">Logout</span>
                {% endif %}
            </div>

        </a>

    </aside>

    <!-- Main -->
    <div class="main-workspace">
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>

</div>
</body>
</html>
